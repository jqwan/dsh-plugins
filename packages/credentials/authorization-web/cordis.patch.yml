# The authorization-web bundle: one row mounting the browser bridge for the
# authorization seam. The seam itself (`ctx.authorization`) is a service
# definition with no mount anywhere in the shipped bundles, so this plugin
# mounts it (and its flows with it — `llm-pi-ai` registers its provider
# sign-ins once the seam appears) plus the gateway controller the browser
# calls to run a sign-in attempt.
- insert:
    - id: authorization-web
      name: '@deepseek-ai/dsh-authorization-web'
