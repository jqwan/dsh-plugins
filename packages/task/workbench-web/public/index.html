  <script>
    // 在首帧绘制前恢复主题，避免 app.js 模块加载期间短暂显示 :root 的旧橙色配色。
    // 嵌入 dsh 时父页面通过 ?dsh=light|dark 传入宿主主题，首帧即对齐。
    (() => {
      const styleClasses = {
        classic: 'theme-classic',
        geek: 'theme-geek',
        'geek-terminal': 'theme-geek',
        aurora: 'theme-aurora',
        newspaper: 'theme-newspaper',
      };
      const style = localStorage.getItem('workbench-style');
      document.body.classList.add(styleClasses[style] || 'theme-classic');
      const hostScheme = new URLSearchParams(location.search).get('dsh');
      const mode = hostScheme === 'light' || hostScheme === 'dark' ? hostScheme : localStorage.getItem('workbench-theme');
      if (hostScheme) localStorage.setItem('workbench-theme', hostScheme);
      if (mode === 'light') document.body.classList.add('theme-light');
      if (mode === 'dark') document.body.classList.add('theme-dark');
      const dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
